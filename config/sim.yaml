bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    # ground truth: the simulator's exact pose and velocity (frame map). For evaluation and
    # debugging only: the real car has no such topic, algorithms must use the estimated pose.
    ego_gt_topic: 'ground_truth'
    ego_opp_gt_topic: 'opp_ground_truth'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_gt_topic: 'ground_truth'
    opp_ego_gt_topic: 'opp_ground_truth'
    opp_drive_topic: 'opp_drive'
    # teleport the cars (RViz 2D Pose Estimate / 2D Goal Pose). Not /initialpose: that one is the localizer's
    ego_reset_topic: '/sim/reset_pose'
    opp_reset_topic: '/sim/opp_reset_pose'

    # transform related
    scan_distance_to_base_link: 0.275

    # localization and odometry
    # 'ground_truth': map -> odom identity, odom -> base_link = true pose (debugging, reference)
    # 'odometry':     only odom -> base_link from the odometry; map -> odom comes from the localizer
    localization: 'ground_truth'
    odom_frame: 'odom'
    odom_topic: '/odom'              # VESC-style odometry, same name as on the car
    odom_rate: 50.0                  # Hz
    wheelbase: 0.3302                # m, lf + lr of the gym's car

    # sensor errors: placeholders until measured on the car
    sensor_noise: True               # False: same rates and range_max, no errors
    noise_seed: 0                    # -1: different noise every run
    odom_speed_scale_error: 0.02     # ERPM gain off by 2%
    odom_speed_noise: 0.02           # std of the measured speed, relative to the speed
    odom_steer_offset: 0.01          # rad, servo trim error
    scan_rate: 40.0                  # Hz (Hokuyo UST-10LX)
    scan_range_std: 0.03             # m, total (the gym already adds 0.01)
    scan_range_max: 10.0             # m, no return beyond
    scan_dropout: 0.01               # fraction of beams with no return
    
    # laserscan parameters
    scan_fov: 4.7
    scan_beams: 1080

    # map parameters
    map_path: '/sim_ws/src/gym-ros_bridge/maps/Spielberg_map'
    map_img_ext: '.png'

    # opponent parameters
    num_agent: 1

    # ego starting pose on map
    sx: 0.0
    sy: 0.0
    stheta: 0.0

    # opp starting pose on map
    sx1: 2.0
    sy1: 0.5
    stheta1: 0.0

    # teleop
    kb_teleop: True